[package]
name = "file-storage"
version = "0.1.0"
edition = "2021"

[lib]
name = "file_storage"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
thiserror = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
