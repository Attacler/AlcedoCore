[package]
name = "platform-docker"
version = "0.1.0"
edition = "2021"

[lib]
name = "platform_docker"
path = "src/lib.rs"

[dependencies]
pcl = { package = "plugin-core-lib", path = "../core", features = ["docker"] }
bollard = "0.20"
bollard-stubs = "=1.52.1-rc.29.1.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
futures-util = "0.3"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
axum = "0.7"
