[package]
name = "alcedo-middleware"
version = "0.1.0"
edition = "2021"

[lib]
name = "alcedo_middleware"
path = "src/lib.rs"

[dependencies]
alcedo-common = { path = "../alcedo-common" }
alcedo-db = { path = "../alcedo-db" }
alcedo-infra = { path = "../alcedo-infra" }
alcedo-services = { path = "../alcedo-services" }
alcedo-plugins = { path = "../alcedo-plugins" }
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tower = "0.5"
tower-sessions = { version = "0.13", features = ["axum-core"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
[dev-dependencies]
rstest = "0.24"
