[package]
name = "alcedo-infra"
version = "0.1.0"
edition = "2021"

[lib]
name = "alcedo_infra"
path = "src/lib.rs"

[dependencies]
alcedo-common = { path = "../alcedo-common" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
deadpool = { version = "0.12", features = ["managed"] }
tower-sessions = { version = "0.13", features = ["axum-core"] }
async-trait = "0.1"
time = { version = "0.3", features = ["serde"] }
rmp-serde = "1"
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
once_cell = "1"