[package]
name = "alcedo-plugins"
version = "0.1.0"
edition = "2021"

[lib]
name = "alcedo_plugins"
path = "src/lib.rs"

[dependencies]
alcedo-common = { path = "../alcedo-common" }
alcedo-container = { path = "../alcedo-container" }
alcedo-db = { path = "../alcedo-db" }
alcedo-infra = { path = "../alcedo-infra" }
alcedo-events = { path = "../alcedo-events" }
alcedo-providers = { path = "../alcedo-providers" }
file-storage = { path = "../file-storage" }
axum = { version = "0.7" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"