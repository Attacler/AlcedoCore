[package]
name = "file-storage-local"
version = "0.1.0"
edition = "2021"

[lib]
name = "file_storage_local"
path = "src/lib.rs"

[dependencies]
pcl = { package = "file-storage", path = "../file-storage" }
async-trait = "0.1"
bytes = "1"
thiserror = "1"
tracing = "0.1"
mime_guess = "2"
tokio = { version = "1", features = ["fs"] }
futures-util = "0.3"  

tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }