[package]
name = "alcedo-services"
version = "0.1.0"
edition = "2021"

[lib]
name = "alcedo_services"
path = "src/lib.rs"

[dependencies]
alcedo-common = { path = "../alcedo-common" }
alcedo-db = { path = "../alcedo-db" }
alcedo-container = { path = "../alcedo-container" }
alcedo-infra = { path = "../alcedo-infra" }
file-storage = { path = "../file-storage" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
sea-query = { version = "0.32", features = ["thread-safe"] }
argon2 = "0.5"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"