[package]
name = "platform-docker"
version = "0.1.0"
edition = "2021"

[lib]
name = "platform_docker"
path = "src/lib.rs"

[dependencies]
alcedo-common = { path = "../alcedo-common", features = ["docker"] }
alcedo-container = { path = "../alcedo-container" }
alcedo-db = { path = "../alcedo-db" }
bollard = "0.20"
bollard-stubs = "=1.52.1-rc.29.1.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
futures-util = "0.3"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
axum = "0.7"
axum-test = "15"
alcedo-api = { path = "../alcedo-api" }
alcedo-infra = { path = "../alcedo-infra" }
deadpool = { version = "0.12", features = ["managed"] }
file-storage = { path = "../file-storage" }
file-storage-local = { path = "../file-storage-local" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
tower-sessions = { version = "0.13", features = ["axum-core"] }