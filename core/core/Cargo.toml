[package]
name = "alcedocore"
version = "0.1.0"
edition = "2021"

[lib]
name = "plugin_core"
path = "src/lib.rs"

[features]
default = []
docker = ["alcedo-common/docker"]

[dependencies]
alcedo-common = { path = "../alcedo-common" }
alcedo-container = { path = "../alcedo-container" }
alcedo-infra = { path = "../alcedo-infra" }
alcedo-db = { path = "../alcedo-db" }
alcedo-events = { path = "../alcedo-events" }
alcedo-services = { path = "../alcedo-services" }
alcedo-providers = { path = "../alcedo-providers" }
alcedo-plugins = { path = "../alcedo-plugins" }
alcedo-middleware = { path = "../alcedo-middleware" }
alcedo-api = { path = "../alcedo-api" }

[dev-dependencies]
axum-test = "15"
http = "1.4.0"
hyper = "1.9.0"
rstest = "0.24"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
tokio-test = "0.4"
tower = "0.5.3"
file-storage-local = { path = "../file-storage-local" }
file-storage = { path = "../file-storage" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
tower-sessions = { version = "0.13", features = ["axum-core"] }
time = { version = "0.3", features = ["serde"] }
deadpool = { version = "0.12", features = ["managed"] }
axum = { version = "0.7", features = ["multipart"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }