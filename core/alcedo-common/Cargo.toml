[package]
name = "alcedo-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "alcedo_common"
path = "src/lib.rs"

[features]
default = []
docker = ["dep:bollard"]

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["sync"] }
thiserror = "1"
config = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
async-trait = "0.1"
bollard = { version = "0.20", optional = true }