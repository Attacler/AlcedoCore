services:
    core:
        build:
            context: ./corev2
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            system-plugin-api:
                condition: service_healthy
        # .env carries the secrets (encryption key, admin bootstrap); the
        # overrides below point at the compose services instead of the host.
        env_file:
            - ./corev2/.env
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/plugin_core
            REDIS_URL: redis://redis:6379
            DOCKER_SOCKET: /var/run/docker.sock
            LOCAL_REGISTRY_URL: host.docker.internal:5000
            SYSTEM_PLUGINS_URL: http://system-plugin-api:9090
        ports:
            - "80:80"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./corev2/.plugins:/app/.plugins
        networks:
            - default
            - alcedocore_plugins

    postgres:
        image: postgres:18
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: plugin_core
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    system-plugin-api:
        build: ./system-plugin-api
        ports:
            - "9090:9090"
        environment:
            PLUGINS_DIR: /app
            PORT: "9090"
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-qO-",
                    "http://localhost:9090/?core_version=0.1.0",
                ]
            interval: 10s
            timeout: 5s
            retries: 3

    redis:
        image: redis:8-alpine
        container_name: redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        restart: unless-stopped
        depends_on:
            - postgres
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@alcedo.dev
            PGADMIN_DEFAULT_PASSWORD: admin123!
        ports:
            - "5050:80"
        volumes:
            - pgadmin-data:/var/lib/pgadmin

    registry:
        image: registry:3
        container_name: registry
        restart: unless-stopped
        ports:
            - "5000:5000"
        volumes:
            - registry-data:/var/lib/registry

networks:
    default:
        name: alcedocore-test_default
    alcedocore_plugins:
        external: true

volumes:
    redis-data:
    pgadmin-data:
    registry-data:
