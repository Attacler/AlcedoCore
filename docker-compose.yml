    postgres:
        image: postgres:16
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: plugin_core
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    system-plugin-api:
        build: ./system-plugin-api
        ports:
            - "9090:9090"
        environment:
            PLUGINS_DIR: /app
            PORT: "9090"
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-qO-",
                    "http://localhost:8080/?core_version=0.1.0",
                ]
            interval: 10s
            timeout: 5s
            retries: 3

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        restart: unless-stopped
        depends_on:
            - postgres
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@alcedo.dev
            PGADMIN_DEFAULT_PASSWORD: admin123!
        ports:
            - "5050:80"
        volumes:
            - pgadmin-data:/var/lib/pgadmin

volumes:
    redis-data:
    pgadmin-data:
