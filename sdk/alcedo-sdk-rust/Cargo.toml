[package]
name = "alcedo-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[lib]
name = "alcedo_sdk"
path = "src/lib.rs"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
