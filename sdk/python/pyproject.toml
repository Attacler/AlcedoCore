[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alcedo-sdk"
version = "0.2.0"
description = "Python SDK for Alcedo Plugin Core"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["alcedo_sdk"]
