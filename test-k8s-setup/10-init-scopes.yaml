apiVersion: batch/v1
kind: Job
metadata:
  name: init-scopes
  namespace: plugin-core
  labels:
    app.kubernetes.io/managed-by: plugin-core
spec:
  template:
    spec:
      containers:
        - name: init
          image: bitnami/postgresql:16
          command:
            - sh
            - -c
            - |
              PGPASSWORD=postgres psql -U postgres -d plugin_core -h postgres <<SQL
              INSERT INTO role_scopes (role_id, scope)
              SELECT id, 'collections.all' FROM roles WHERE name = 'admin'
              ON CONFLICT DO NOTHING;
              SQL
      restartPolicy: Never
  backoffLimit: 3
