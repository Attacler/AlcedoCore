---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: alcedocore
    namespace: alcedocore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: alcedocore
rules:
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources:
          ["pods", "services", "configmaps", "secrets", "events", "pods/log"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources: ["pods/exec"]
      verbs: ["create"]
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "create", "delete"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: alcedocore
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: alcedocore
subjects:
    - kind: ServiceAccount
      name: alcedocore
      namespace: alcedocore
