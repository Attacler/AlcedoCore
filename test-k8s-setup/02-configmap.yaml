apiVersion: v1
kind: ConfigMap
metadata:
    name: core-config
    namespace: alcedocore
data:
    CORE_PORT: "8080"
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/plugin_core"
    REDIS_URL: "redis://redis:6379"
    DEV_MODE: "false"
    RUST_LOG: "info"
    PLUGIN_NETWORK: "alcedocore"
    CORE_PUBLIC_URL: "http://localhost:8080"
    SYSTEM_PLUGINS_URL: ""
    LOCAL_REGISTRY_URL: "k3d-k3d-k8s-e2e-registry:5000"
    SESSION_TTL_SECONDS: "86400"
    COLLECTION_LOG_FLUSH_MS: "100"
    RATE_LIMIT_AUTH_REQUESTS: "100"
    RATE_LIMIT_AUTH_WINDOW: "60"
    RATE_LIMIT_API_REQUESTS: "1000"
    RATE_LIMIT_API_WINDOW: "60"
    SECURITY_COOKIE_SECURE: "false"
    SECURITY_COOKIE_SAMESITE: "lax"
    SECURITY_COOKIE_HTTP_ONLY: "true"
    SECURITY_SESSION_FIXATION: "true"
    SECURITY_PASSWORD_MIN_LENGTH: "8"
    PLUGINS_DIR: "/plugins"
    PLUGINS_DIR: "/var/lib/plugin-public"
