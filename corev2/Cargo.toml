[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["http2", "macros", "multipart"] }
axum-reverse-proxy = "1.0.3"
bytes = "1"
chrono = { version = "0.4.42", features = ["serde"]}
dashmap = "6.1.0"
dotenvy = "0.15.7"
file-storage = { path = "file-storage" }
file-storage-local = { path = "file-storage-local" }
file-storage-s3 = { path = "file-storage-s3", optional = true }
futures = "0.3.31"
http2 = "0.5.8"
hyper-util = "0.1.17"
include_dir = "0.7.4"
mime_guess = "2.0.5"
rand = "0.9.2"
time = { version = "0.3", features = ["serde"] }
regex = "1.12.2"
sea-query = { version = "0.32.7", features = ["thread-safe", "with-json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_qs = { version = "0.15.0", features = ["axum"] }
sqlx = { version = "0.8.6", features = ["derive", "postgres", "runtime-tokio", "chrono","uuid"] }
sqlx_migrator = { version = "0.18.0", features = ["postgres"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "fs"] }
url = "2.5.4"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["uuid"] }
utoipa-axum = "0.2.0"
uuid = { version = "1", features = ["v4", "serde"] }
cookie = "0.18"
deadpool-redis = "0.23.1"
argon2 = "0.6.0"
aes-gcm = "0.10.3"
base64 = "0.22.1"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "webpki-roots", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
s3 = ["file-storage-s3"]
