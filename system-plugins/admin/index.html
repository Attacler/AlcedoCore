<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link id="favicon" rel="icon" href="/favicon.ico">
  <style>
    :root {
      --p-primary-50: oklch(0.97 0.03 260);
      --p-primary-100: oklch(0.92 0.05 260);
      --p-primary-200: oklch(0.85 0.08 260);
      --p-primary-300: oklch(0.75 0.10 260);
      --p-primary-400: oklch(0.65 0.12 260);
      --p-primary-500: oklch(0.55 0.15 260);
      --p-primary-600: oklch(0.45 0.15 260);
      --p-primary-700: oklch(0.35 0.12 260);
      --p-primary-800: oklch(0.25 0.08 260);
      --p-primary-900: oklch(0.15 0.05 260);
      --p-primary-color: oklch(0.45 0.15 260);
      --p-primary-hover-color: oklch(0.35 0.12 260);
      --p-primary-active-color: oklch(0.25 0.08 260);
      --p-primary-contrast-color: #ffffff;
      --p-surface-0: #ffffff;
      --p-surface-50: oklch(0.97 0 0);
      --p-surface-100: oklch(0.96 0.01 285);
      --p-surface-200: oklch(0.92 0.01 285);
      --p-surface-300: oklch(0.87 0.01 285);
      --p-surface-400: oklch(0.70 0.01 285);
      --p-surface-500: oklch(0.55 0.02 285);
      --p-surface-600: oklch(0.45 0.02 285);
      --p-surface-700: oklch(0.35 0.02 285);
      --p-surface-800: oklch(0.25 0.02 285);
      --p-surface-900: oklch(0.15 0.02 285);
      --p-text-color: oklch(0.15 0.02 285);
      --p-text-muted-color: oklch(0.55 0.02 285);
      --p-text-hover-color: oklch(0.35 0.02 285);
      --p-border-color: oklch(0.88 0.01 285);
      --p-border-hover-color: oklch(0.78 0.01 285);
      --p-border-focus-color: oklch(0.55 0.15 260);
      --p-content-background: #ffffff;
      --p-content-hover-background: oklch(0.97 0 0);
      --p-content-border-color: oklch(0.88 0.01 285);
      --p-error-color: #ef4444;
      --p-info-color: #3b82f6;
      --p-success-color: #22c55e;
      --p-warning-color: #f59e0b;
      --p-dialog-header-background: #ffffff;
      --p-dialog-header-color: oklch(0.15 0.02 285);
      --p-dialog-content-background: #ffffff;
      --p-dialog-content-color: oklch(0.35 0.02 285);
      --p-dialog-footer-background: #ffffff;
      --p-dialog-footer-color: oklch(0.35 0.02 285);
      --p-dialog-border-color: oklch(0.92 0.01 285);
      --p-dialog-border-radius: 12px;
      --p-dialog-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --p-inputtext-background: #ffffff;
      --p-inputtext-color: oklch(0.35 0.02 285);
      --p-inputtext-border-color: oklch(0.87 0.01 285);
      --p-inputtext-hover-border-color: oklch(0.78 0.01 285);
      --p-inputtext-focus-border-color: oklch(0.55 0.15 260);
      --p-inputtext-border-radius: 6px;
      --p-inputtext-padding-y: 0.5rem;
      --p-inputtext-padding-x: 0.75rem;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
